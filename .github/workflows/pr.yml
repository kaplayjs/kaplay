name: PR Changes Summary

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: nrutman/lines-changed-gha@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file-groups: |
            - label: "🧪 Examples & Tests"
              patterns:
                - "**/tests/**"
                - "**/examples/**"
              count: false
            - label: "📜 Changelog"
              patterns:
                - "**/CHANGELOG.md"
              count: false
            - label: "📦 Lock Files"
              patterns:
                - "*-lock.*"
                - "*.lock"
              count: false
          default-group-label: "🏅 Source Code"
