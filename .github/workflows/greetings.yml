name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "OHHI! I'm lajbel, thank you for this first issue, remember reading contributor guidelines!"
        pr-message: "OHHI! Congratulations on your first PR. If you're a new developer, enjoy this journey and be sure KAPLAY repo is one of the best places to do your first contributions. If you're experienced dev, thank you :>"
